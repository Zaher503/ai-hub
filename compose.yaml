# AI hub: one Ollama, one Whisper, one front door that queues GPU work and reports the wait.
# Every other app talks to http://ai-hub:11434 on the shared "ai" network.
name: ai-hub

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=30s
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ${OLLAMA_DIR:-/srv/ai-hub/ollama}:/root/.ollama
    <<: *gpu
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Pulls the models in OLLAMA_MODELS once (models already present are skipped), then exits
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_MODELS=${OLLAMA_MODELS:-gemma4:e4b}
    entrypoint: ["sh", "-c", "for m in $$OLLAMA_MODELS; do ollama pull $$m; done"]
    restart: "no"

  whisper:
    image: ghcr.io/zaher503/ai-hub-whisper:${AI_HUB_TAG:-latest}
    build: ./whisper
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
    volumes:
      - ${HF_DIR:-/srv/ai-hub/hf}:/hf
    <<: *gpu

  gateway:
    image: ghcr.io/zaher503/ai-hub-gateway:${AI_HUB_TAG:-latest}
    build: ./gateway
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      whisper:
        condition: service_started
    environment:
      - OLLAMA_URL=http://ollama:11434
      - WHISPER_URL=http://whisper:9000
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
    ports:
      - "127.0.0.1:${AI_HUB_PORT:-11434}:11434"
    networks:
      default:
        aliases: [ai-hub]

networks:
  default:
    name: ai
