name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: ruff check .
      - run: python -m compileall -q gateway/app whisper
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml config -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: whisper
          push: false
          cache-from: type=gha,scope=whisper
          cache-to: type=gha,scope=whisper,mode=max
